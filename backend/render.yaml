services:
  - type: web
    name: aporum-sales-agent-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: ALLOWED_ORIGINS
        value: https://YOUR-VERCEL-DOMAIN.vercel.app,http://localhost:5173
      - key: ADMIN_API_KEY
        sync: false
